<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Busca de Produtos</title>
</head>
<body>

    <h1>Busca de Produtos</h1>

    <input
        type="text"
        id="busca"
        placeholder="Digite um produto"
    >

    <button onclick="buscar()">
        Buscar
    </button>

    <hr>

    <div id="resultado"></div>

    <script>
        function buscar() {
            const termo = document.getElementById("busca").value;

            //  VULNERABILIDADE AQUI (XSS / Script Injection):
            // O uso de innerHTML interpreta qualquer tag HTML ou script digitado
            // pelo usuário no campo de busca e os executa diretamente no navegador.
            document.getElementById("resultado").innerHTML =
                "Você pesquisou por: " + termo;
        }
    </script>

</body>
</html>
